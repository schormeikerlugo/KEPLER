[package]
name = "kepler-desktop"
description = "Centro de Control de KEPLER (escritorio, Slint)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "kepler-centro"
path = "src/main.rs"

[dependencies]
kepler-cliente.workspace = true
kepler-core.workspace = true
kepler-proto.workspace = true

# Mapa: MapLibre Native (C++, se compila la primera vez; necesita cmake). OpenGL/EGL como Slint
maplibre_native = { version = "0.10.0", default-features = false, features = ["opengl", "json"] }

base64 = "0.22"
chrono.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = "0.17.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2"] }
serde.workspace = true
serde_json.workspace = true
# unstable-winit-030 (actividad del usuario para el cierre por inactividad) exige fijar la versión menor
slint = { version = "~1.18.1", features = ["unstable-winit-030"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
# wss:// cuando el servidor salga por Cloudflare Tunnel
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid.workspace = true

[build-dependencies]
serde_json.workspace = true
slint-build = "~1.18.1"

# El código que genera Slint necesita `allow(unsafe_code)`: deny en vez del forbid del workspace
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
