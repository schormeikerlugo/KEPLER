# Proyecto de Xcode generado con XcodeGen: no editar Kepler.xcodeproj a mano.
name: Kepler
options:
  bundleIdPrefix: dev.schormeiker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
targets:
  Kepler:
    type: application
    platform: iOS
    sources:
      - path: Kepler
      # YOLO para CoreML (models/export/exportar_coreml.py; no versionado)
      - path: ../../models/coreml/yolo26s_vertical.mlpackage
      # Cuadrado 640×640: solo para comparar con el vertical (KEPLER_TRAZA); se quitará
      - path: ../../models/coreml/yolo26s.mlpackage
      - path: ../../design/fonts
        buildPhase: resources
        includes:
          - "Jura-Regular.ttf"
          - "Jura-Medium.ttf"
          - "Jura-SemiBold.ttf"
          - "Jura-Bold.ttf"
    dependencies:
      # Núcleo Rust (scripts/ios.sh nucleo)
      - framework: build/KeplerMovil.xcframework
        embed: false
      - package: MapLibre
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: LocalAuthentication.framework
      - sdk: CoreLocation.framework
      - sdk: AVFoundation.framework
      - sdk: Vision.framework
      - sdk: CoreML.framework
      - sdk: HealthKit.framework
      - sdk: CoreMotion.framework
      - sdk: CoreBluetooth.framework
    entitlements:
      path: Kepler/Kepler.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Kepler/Info.plist
      properties:
        CFBundleDisplayName: KEPLER
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        # Rastro GPS de la misión con la app en segundo plano
        UIBackgroundModes:
          - location
          # Escuchar el reloj Carbinox con la app en segundo plano
          - bluetooth-central
        UILaunchScreen:
          UIColorName: FondoLanzamiento
        UIAppFonts:
          - Jura-Regular.ttf
          - Jura-Medium.ttf
          - Jura-SemiBold.ttf
          - Jura-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSLocationWhenInUseUsageDescription: KEPLER usa tu ubicación para el clima, la calidad del aire y los peligros cercanos de tu zona.
        NSCameraUsageDescription: KEPLER usa la cámara para detectar y registrar objetos, personas y puntos de interés en campo.
        NSFaceIDUsageDescription: KEPLER usa Face ID para reabrir tu sesión sin escribir la contraseña.
        NSLocalNetworkUsageDescription: KEPLER se conecta al servidor de tu base (cortex) en la red local para sincronizar misiones y hallazgos.
        NSHealthShareUsageDescription: KEPLER lee de Salud tu pulso, oxígeno, pasos, sueño y estado de ánimo (los que envía tu reloj) para tus misiones y Cortex.
        NSHealthUpdateUsageDescription: KEPLER guarda en Salud el estado de ánimo que registras.
        NSMotionUsageDescription: KEPLER usa el barómetro y el podómetro del iPhone para la altitud, la presión y tus pasos en campo.
        NSBluetoothAlwaysUsageDescription: KEPLER se conecta por Bluetooth a tu reloj para leer pulso, oxígeno y otros sensores.
        # Documentos/reloj (registros del Bluetooth) visibles en la app Archivos
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schormeiker.kepler
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["-lc++"]
