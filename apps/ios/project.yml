# Proyecto de Xcode generado con XcodeGen: no editar Kepler.xcodeproj a mano.
name: Kepler
options:
  bundleIdPrefix: dev.schormeiker
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Kepler:
    type: application
    platform: iOS
    sources:
      - path: Kepler
      - path: ../../design/fonts
        buildPhase: resources
        includes:
          - "Jura-Regular.ttf"
          - "Jura-Medium.ttf"
          - "Jura-SemiBold.ttf"
          - "Jura-Bold.ttf"
    dependencies:
      # Núcleo Rust (scripts/ios.sh nucleo)
      - framework: build/KeplerMovil.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: LocalAuthentication.framework
      - sdk: CoreLocation.framework
    info:
      path: Kepler/Info.plist
      properties:
        CFBundleDisplayName: KEPLER
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: FondoLanzamiento
        UIAppFonts:
          - Jura-Regular.ttf
          - Jura-Medium.ttf
          - Jura-SemiBold.ttf
          - Jura-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSLocationWhenInUseUsageDescription: KEPLER usa tu ubicación para el clima, la calidad del aire y los peligros cercanos de tu zona.
        NSFaceIDUsageDescription: KEPLER usa Face ID para reabrir tu sesión sin escribir la contraseña.
        NSLocalNetworkUsageDescription: KEPLER se conecta al servidor de tu base (cortex) en la red local para sincronizar misiones y hallazgos.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schormeiker.kepler
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["-lc++"]
