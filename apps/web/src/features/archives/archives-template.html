    <div class="archives-container">
        <!-- Header -->
        <header class="archives-header">
            <img src="/assets/logotipo.svg" alt="KEPLER" class="header-logo" style="height: 20px;">
            <div class="stats-bar" id="stats-bar">
                <!-- Populated by JS -->
            </div>
            <a href="/" class="btn-back">Dashboard</a>
        </header>

        <!-- Main Content -->
        <div class="archives-main">
            <!-- Sidebar: Missions -->
            <aside class="missions-panel" id="mission-list">
                <div class="panel-header">
                    <span class="panel-title">Misiones</span>
                </div>

                <div class="status-filters" id="status-filters">
                    <span class="status-badge live">En Curso</span>
                    <span class="status-badge active">Activa</span>
                    <span class="status-badge completed">Completada</span>
                </div>

                <!-- Mission cards populated by JS -->
                <div style="color: #555; text-align: center; padding: 30px; font-size: 0.85rem;">Cargando...</div>
            </aside>

            <!-- Main Content Panel -->
            <main class="content-panel">
                <div class="content-header">
                    <h2 class="content-title" id="current-mission-title">Selecciona una Misión</h2>
                    <div class="action-buttons">
                        <button class="btn-action finish" id="btn-finish-mission" style="display:none;">Finalizar</button>
                        <button class="btn-action delete" id="btn-delete-mission" style="display:none;">Eliminar</button>
                    </div>
                </div>

                <!-- Horizontal Tabs -->
                <div class="content-tabs" id="content-tabs">
                    <button class="tab-btn active" data-tab="objetos">
                        Objetos <span class="tab-count" id="tab-count-objetos">0</span>
                    </button>
                    <button class="tab-btn" data-tab="personas">
                        Personas <span class="tab-count" id="tab-count-personas">0</span>
                    </button>
                    <button class="tab-btn" data-tab="rutas">
                        Rutas <span class="tab-count" id="tab-count-rutas">0</span>
                    </button>
                    <button class="tab-btn" data-tab="telemetria">
                        Telemetría
                    </button>
                </div>

                <!-- Tab: Objetos -->
                <div class="tab-panel active" id="panel-objetos">
                    <div class="action-buttons" style="margin-bottom: 10px;">
                        <select class="filter-select" id="filter-category">
                            <option value="">Todas las Categorías</option>
                        </select>
                        <select class="filter-select" id="filter-tag">
                            <option value="">Todas las Etiquetas</option>
                        </select>
                    </div>
                    <div class="objects-grid" id="evidence-grid">
                        <div class="empty-state">Selecciona una misión para ver sus registros.</div>
                    </div>
                </div>

                <!-- Tab: Personas -->
                <div class="tab-panel" id="panel-personas">
                    <div class="personas-grid" id="personas-grid">
                        <div class="empty-state">
                            <div class="empty-state-icon">👤</div>
                            No hay personas registradas en esta misión.
                        </div>
                    </div>
                </div>

                <!-- Tab: Rutas -->
                <div class="tab-panel" id="panel-rutas">
                    <div class="rutas-list" id="rutas-list">
                        <div class="empty-state">
                            <div class="empty-state-icon">🗺️</div>
                            No hay rutas registradas en esta misión.
                        </div>
                    </div>
                </div>

                <!-- Tab: Telemetría -->
                <div class="tab-panel" id="panel-telemetria">
                    <div id="telemetry-content">
                        <div class="empty-state">
                            <div class="empty-state-icon">📡</div>
                            Selecciona una misión para ver su telemetría.
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detail-modal">
        <button class="close-modal" id="btn-close-modal">&times;</button>
        <div class="modal-body">
            <div class="modal-img-container">
                <img src="" alt="Evidencia" class="modal-img" id="detail-img">
            </div>
            <div class="modal-form">
                <h3 class="modal-title">Editar Registro</h3>

                <!-- Metadata section -->
                <div class="modal-metadata" id="modal-metadata">
                    <!-- Populated by JS -->
                </div>

                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" class="form-input" id="inp-detail-title">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Categoría</label>
                        <select class="form-select" id="inp-detail-category">
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Subcategoría</label>
                        <select class="form-select" id="inp-detail-subcategory">
                        </select>
                    </div>
                </div>

                <div class="form-group" id="group-gender" style="display:none;">
                    <label>Género</label>
                    <select class="form-select" id="inp-detail-gender">
                        <option value="">N/A</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Etiquetas</label>
                    <div class="tags-container" id="tags-selector">
                    </div>
                </div>

                <div class="form-group">
                    <label>Notas de Campo</label>
                    <textarea class="form-textarea" id="inp-detail-desc"></textarea>
                </div>

                <div class="modal-actions">
                    <button class="btn-modal delete" id="btn-delete-obj">Eliminar</button>
                    <button class="btn-modal save" id="btn-save-obj">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>
