[package]
name = "kepler-server"
description = "API REST + WebSocket en vivo de KEPLER"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
kepler-core.workspace = true
kepler-proto.workspace = true
kepler-vision.workspace = true

axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
chrono.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
prost.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-none", "uuid", "chrono", "json", "derive"] }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "fs", "limit", "trace"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid.workspace = true

[dev-dependencies]
tokio-tungstenite = "0.30.0"
http-body-util = "0.1"

[lints]
workspace = true
