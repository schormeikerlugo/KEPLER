[workspace]
resolver = "3"
members = ["crates/*", "services/kepler-server", "apps/desktop"]
# Prototipos de UI (paso 6): proyectos independientes para compararlos
exclude = ["apps/desktop/prototipos"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/schormeikerlugo/KEPLER"
authors = ["Schormeikerl <schormeikerl@gmail.com>"]

[workspace.dependencies]
kepler-core = { path = "crates/kepler-core" }
kepler-proto = { path = "crates/kepler-proto" }
kepler-vision = { path = "crates/kepler-vision" }
kepler-ai = { path = "crates/kepler-ai" }
kepler-cliente = { path = "crates/kepler-cliente" }
kepler-mapa = { path = "crates/kepler-mapa" }

chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
