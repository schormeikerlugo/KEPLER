[workspace]
resolver = "3"
members = ["crates/*", "services/*"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/schormeikerlugo/KEPLER"
authors = ["Schormeikerl <schormeikerl@gmail.com>"]

[workspace.dependencies]
kepler-core = { path = "crates/kepler-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
